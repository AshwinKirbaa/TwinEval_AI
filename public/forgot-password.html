<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - TwinEval AI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body class="auth-page">
  <div class="auth-container" style="grid-template-columns:1fr;max-width:620px;min-height:100vh;">
    <div class="glass-card auth-card">
      <div class="brand-logo" style="margin:0 auto 18px;"><i class="fa-solid fa-brain"></i></div>
      <div class="auth-header" style="text-align:center;">
        <h1 class="auth-title">Forgot your password?</h1>
        <p class="auth-subtitle">Enter your account email and we will send you a link to choose a new password.</p>
      </div>

      <form id="forgotForm" class="auth-form" novalidate>
        <div id="forgotMessage" role="status" aria-live="polite" hidden style="margin-bottom:1rem;padding:0.85rem 1rem;border:1px solid #c9d6f2;background:#f3f6ff;color:#3d4f86;border-radius:10px;font-size:0.78rem;line-height:1.5;"></div>
        <div id="forgotError" role="alert" aria-live="assertive" hidden style="margin-bottom:1rem;padding:0.85rem 1rem;border:1px solid #f1b7b7;background:#fff4f4;color:#b84f4f;border-radius:10px;font-size:0.78rem;line-height:1.5;"></div>
        <div class="form-group">
          <label for="forgotEmail" class="form-label">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="forgotEmail" class="form-input" placeholder="alex.m@university.edu" autocomplete="email" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="forgotBtn">
          <span>Send reset link</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>

      <div class="auth-footer">
        Remembered it? <a href="index.html" class="auth-link">Back to sign in</a>
      </div>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const btn = document.getElementById('forgotBtn');
    const messageBox = document.getElementById('forgotMessage');
    const errorBox = document.getElementById('forgotError');
    let submitting = false;

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submitting) return;
      messageBox.hidden = true;
      errorBox.hidden = true;
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) {
        errorBox.textContent = 'Enter your email address.';
        errorBox.hidden = false;
        return;
      }
      submitting = true;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
      btn.disabled = true;
      try {
        const res = await TwinEvalApp.apiFetch('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ email }) });
        messageBox.textContent = res.message;
        messageBox.hidden = false;
      } catch (error) {
        errorBox.textContent = error.message || 'Could not process your request. Please try again.';
        errorBox.hidden = false;
      } finally {
        btn.innerHTML = originalHtml;
        // Keep the button disabled briefly so the form cannot be spammed.
        setTimeout(() => { btn.disabled = false; submitting = false; }, 5000);
      }
    });
  </script>
</body>
</html>
