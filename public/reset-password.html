<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password - TwinEval AI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body class="auth-page">
  <div class="auth-container" style="grid-template-columns:1fr;max-width:620px;min-height:100vh;">
    <div class="glass-card auth-card">
      <div class="brand-logo" style="margin:0 auto 18px;"><i class="fa-solid fa-brain"></i></div>
      <div class="auth-header" style="text-align:center;">
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-subtitle">Use at least 12 characters, including a letter and a number.</p>
      </div>

      <form id="resetForm" class="auth-form" novalidate>
        <div id="resetError" role="alert" aria-live="assertive" hidden style="margin-bottom:1rem;padding:0.85rem 1rem;border:1px solid #f1b7b7;background:#fff4f4;color:#b84f4f;border-radius:10px;font-size:0.78rem;line-height:1.5;"></div>
        <div class="form-group">
          <label for="newPassword" class="form-label">New password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="newPassword" class="form-input" autocomplete="new-password" minlength="12" maxlength="72" required>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmNewPassword" class="form-label">Confirm new password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="confirmNewPassword" class="form-input" autocomplete="new-password" minlength="12" maxlength="72" required>
          </div>
        </div>
        <label class="checkbox-container" style="margin-bottom:1rem;">
          <input type="checkbox" id="showResetPasswords"><span class="checkmark"></span>Show passwords
        </label>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="resetBtn">
          <span>Update password</span>
          <i class="fa-solid fa-key"></i>
        </button>
      </form>

      <div class="auth-footer">
        <a href="forgot-password.html" class="auth-link">Request a new link</a> &middot; <a href="index.html" class="auth-link">Back to sign in</a>
      </div>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('resetBtn');
    const errorBox = document.getElementById('resetError');
    const token = new URLSearchParams(window.location.search).get('token');
    let submitting = false;

    function showError(message) {
      errorBox.textContent = message;
      errorBox.hidden = false;
    }

    document.getElementById('showResetPasswords').addEventListener('change', (event) => {
      const type = event.target.checked ? 'text' : 'password';
      document.getElementById('newPassword').type = type;
      document.getElementById('confirmNewPassword').type = type;
    });

    if (!token) {
      showError('This reset link is missing its token. Request a new link.');
      btn.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submitting || !token) return;
      errorBox.hidden = true;
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmNewPassword').value;
      if (password.length < 12) return showError('Password must be at least 12 characters long.');
      if (new TextEncoder().encode(password).length > 72) return showError('Password must be at most 72 bytes long.');
      if (!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) return showError('Password must contain at least one letter and one number.');
      if (password !== confirm) return showError('Password and confirm password do not match.');

      submitting = true;
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Updating...';
      btn.disabled = true;
      try {
        await TwinEvalApp.apiFetch('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, password, confirm_password: confirm })
        });
        localStorage.removeItem('twineval_user');
        window.location.replace('index.html?reset=1');
      } catch (error) {
        showError(error.message || 'Could not update your password. Please try again.');
        btn.innerHTML = originalHtml;
        btn.disabled = false;
        submitting = false;
      }
    });
  </script>
</body>
</html>
